apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restaurant-order.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restaurant-order.labels" . | nindent 4 }}
spec:
  # File-based H2 must not be shared by multiple application instances.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "restaurant-order.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "restaurant-order.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: order
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: DB_URL
              value: jdbc:h2:file:/app/data/orderdb
            - name: MENU_SERVICE_URL
              value: {{ .Values.menuServiceUrl | quote }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/orders
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "restaurant-order.fullname" . }}-data
