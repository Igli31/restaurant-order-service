apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "restaurant-order.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  annotations:
    # Retain the database claim if the Helm release is uninstalled.
    helm.sh/resource-policy: keep
  labels:
    {{- include "restaurant-order.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
