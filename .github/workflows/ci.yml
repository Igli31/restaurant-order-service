name: Order service CI

on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and build the application
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
