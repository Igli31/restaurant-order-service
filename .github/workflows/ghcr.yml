name: Publish order image

on:
  push:
    branches: [development, testing]

permissions:
  contents: read

# Serialize publishing and deployment separately for each target branch.
concurrency:
  group: ghcr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set the image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile runs Maven verify, including tests, before producing the image.
      - name: Build and test the image
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_REF_NAME" \
            .

      - name: Publish the image
        run: |
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"

  deploy-environment:
    name: Deploy ${{ github.ref_name }}
    needs: publish
    uses: ./.github/workflows/cd.yml
