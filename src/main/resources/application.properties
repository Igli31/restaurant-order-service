spring.application.name=restaurant-order-service
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/orderdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
clients.menu.url=${MENU_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.menu-service.connectTimeout=2000
spring.cloud.openfeign.client.config.menu-service.readTimeout=3000